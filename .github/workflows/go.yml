# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libportaudiocpp0 portaudio19-dev multimon-ng sox

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build
      run: go build -v ./...

    - name: Verify gateway and companion UI build
      run: |
        make build
        test -x bin/sparky
        test -x bin/sparky-config
        sed -e "s|{{WORKING_DIRECTORY}}|$PWD/bin/|g" \
            -e "s|{{EXEC_START}}|$PWD/bin/sparky-config|g" \
            -e "s|{{SERVICE_USER}}|$(id -un)|g" \
            sparky-config.service.template > /tmp/sparky-config-ci.service
        if grep -q '{{' /tmp/sparky-config-ci.service; then
          echo "Unrendered systemd template placeholders" >&2
          exit 1
        fi
        make -n install-config-service > /tmp/sparky-config-make-dry-run.txt
        grep -F 'systemctl enable --now sparky-config.service' /tmp/sparky-config-make-dry-run.txt
        # Inspect expanded recipes: these must reach the shell as command substitutions.
        grep -F '"$(id -un)"' /tmp/sparky-config-make-dry-run.txt
        grep -F '"$(sudo stat -c %a /etc/sparky/config-ui.env)"' /tmp/sparky-config-make-dry-run.txt
        grep -F '"$(sudo stat -c %u /etc/sparky/config-ui.env)"' /tmp/sparky-config-make-dry-run.txt
        if grep -E '"" = "(600|0)"' /tmp/sparky-config-make-dry-run.txt; then
          echo "Preflight shell substitution swallowed by Make" >&2
          exit 1
        fi

    - name: Test
      run: go test -v ./...

    - name: Smoke-test performance fixtures
      run: go test ./internal/aprs ./internal/pubsub ./internal/observability -run '^$' -bench 'Benchmark(ParsePacket|ParseAndClassify|PositionDecode|Fanout|PublishOneSubscriber|MetricsScrape)' -benchtime=1x -count=1 -timeout=2m

    - name: Set up minimum supported Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Test offline WAV replay evaluator (Python 3.10)
      run: |
        python -m py_compile scripts/evaluate-aprs-wav.py
        python -m unittest discover -s scripts -p 'test_evaluate_aprs_wav.py' -v

    - name: Test with race detector
      run: go test -race -v ./...
